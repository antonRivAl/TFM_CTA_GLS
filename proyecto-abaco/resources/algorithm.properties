skewed.alpha=18.5

# funcion de distancia a utilizar:
#   - "fitness": |f(x) - f(x')|
#   - "slots": num slots distintos entre si
skewed.funcionDistancia=slots


###################################
##  GUIDED LOCAL SEARCH (GLS)    ##
###################################

## Peso λ de las penalizaciones en la función aumentada h(t)
gls.lambda=10.0

## Probabilidad de aceptar un movimiento sin compararlo con h_actual (diversificación pura) cuando
## el algoritmo está en modo abierto
gls.porcentajeMovDiversificacion=0.01

## Peso W0 del término f0 (eliminación de controladores imaginarios) en el fitness unificado.
gls.w_imaginarios=1.0

## Iteraciones consecutivas sin mejora de h(t) antes de considerar que
## Rango útil: [50, 500]. Valores bajos → penaliza con más frecuencia. 1000
gls.patience=500

## CONDICIONES DE PARADA

## Mejora mínima (%) de g_best entre ciclos. Si la mejora es inferior
## a este valor Y el ratio de mejoras también lo es, se para.
## Recomendado más estricto que SA (0.005 vs 0.035) porque GLS diverge menos.
gls.condicionParadaPorcent=0.000000000001

## Nº de iteraciones entre comprobaciones de la condición de parada.
## Mismo valor que SA es razonable (50000-100000).
gls.condicionParadaCiclos=150000


## Parametros que no uso que acabaré quitando. Cuando los quite
## tengo que modificar parameters.py para que no me de error, y no se si algo más
gls.pRandMove=0.0
gls.p_guided=0.0
gls.vecindarioSize=1
